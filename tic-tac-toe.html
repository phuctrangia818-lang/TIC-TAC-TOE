<!DOCTYPE html>
<html>
    <head>
        <title>TIC TAC TOE</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="tic-tac-toe.css"> 
        <script src="tic-tac.toe.js" defer ></script>
    </head>
    <body>
        <header>
            <h1>TIC TAC TOE</h1>
            <p class="promote" >Have Fun Playing!</p>
        </header>
        <hr>
        <main>
            <div class="board" id="board" >
                <div class="row1" id="row1"  >
                    <div class="square" id="square" data-row="0" data-col="0">
                        <p></p>
                    </div>
                    <div class="square" id="square"  data-row="0" data-col="1">
                        <p></p>
                    </div>
                    <div class="square" id="square"  data-row="0" data-col="2" >
                        <p></p>
                    </div>
                </div>
                <div class="row2" id="row2" >
                    <div class="square" id="square"  data-row="1" data-col="0" >
                        <p></p>
                    </div>
                    <div class="square" id="square"  data-row="1" data-col="1"  >
                        <p></p>
                    </div>
                    <div class="square" id="square"  data-row="1" data-col="2" >
                        <p></p>
                    </div>
                </div>
                <div class="row3" id="row3" >
                    <div class="square" id="square"  data-row="2" data-col="0" >
                        <p></p>
                    </div>
                    <div class="square" id="square"  data-row="2" data-col="1" >
                        <p></p>
                    </div>
                    <div class="square" id="square"  data-row="2" data-col="2" >
                        <p></p>
                    </div>
                </div>
            <p class="turn" id="turn" >Turn: X</p> 
        </main>
        <hr>

                <a href="https://github.com" target="_blank" >Link to my github: github.com</a>
            </address>
        </footer>
    </body>
</html>
